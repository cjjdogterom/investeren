name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false   # niet halverwege afbreken: dat liet de volgende uitrol zonder artifact achter

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Productie-build (JSX precompileren, React production)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # GitHub Pages geeft af en toe een tijdelijke fout ("try again later"): na een halve minuut nog eens proberen.
      - name: Even wachten na mislukte uitrol
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy (tweede poging)
        if: steps.deployment.outcome == 'failure'
        id: deployment2
        uses: actions/deploy-pages@v5
