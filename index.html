<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Investeringen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Investeringen" />
<meta id="meta-theme-light" name="theme-color" content="#eff1f3" media="(prefers-color-scheme: light)" />
<meta id="meta-theme-dark" name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('investeringen-ui-v1') || 'null');
      var t = p && p.theme;
      if (!t) {
        var s = JSON.parse(localStorage.getItem('investeringen-v3') || 'null');
        var o = s && s.tweaks && s.tweaks.theme;
        t = /^(dark|terminal|nord|nebula|catppuccin|gruvbox|rosepine)$/.test(o) ? 'dark' : /^(warm|solarized)$/.test(o) ? 'light' : 'system';
      }
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      if (p && p.cvd) document.documentElement.setAttribute('data-cvd', 'on');
    } catch (e) {}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js" integrity="sha384-DjOvX/sJLsmbMrw4wTvf6l3kiGBjdxyOO6X2MTFwOOXGkjN/mE08BoDzrpaaIjil" crossorigin="anonymous"></script>
<style>
  /* ================= TOKENS: light ================= */
  :root {
    color-scheme: light;
    --bg: #eff1f3;
    --canvas: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --surface-3: #e7eaee;
    --border: #e1e3e7;
    --border-strong: #cccfd5;
    --fg: #161a1f;
    --fg-muted: #51555d;
    --fg-subtle: #656970;
    --ink: #161a1f;
    --on-ink: #ffffff;
    --scrim: rgb(22 26 31 / .38);
    --accent: #4a55d2;
    --accent-soft: #ecf0fe;
    --on-accent: #ffffff;
    --gain: #007346;
    --loss: #c32a28;
    --gain-fill: #14653d;
    --loss-fill: #ea6747;
    --warn: #945c00;
    --warn-soft: #fff1d6;
    --cap-inleg: #c7cbd1;
    --wash-inleg: rgb(22 26 31 / .045);
    --cat-pe: #eb6834;
    --cat-idx: #2a78d6;
    --cat-pm: #eda100;
    --cat-cr: #e87ba4;
    --cat-cf: #4a3aa7;
    --cat-br: #1baf7a;
    --cat-other: #6b7a99;
    --cat-liq: #8a8f97;
    --shadow-overlay: 0 0 0 1px rgb(22 26 31 / .06), 0 24px 64px rgb(22 26 31 / .18);
    --display-weight: 600;

    --gain-soft: color-mix(in srgb, var(--gain) 12%, var(--surface));
    --loss-soft: color-mix(in srgb, var(--loss) 12%, var(--surface));

    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

    --r-1: 4px;
    --r-2: 8px;
    --r-card: 12px;
    --r-4: 16px;
    --r-sheet: 20px;
    --r-pill: 999px;

    --d-1: 120ms;
    --d-2: 180ms;
    --d-3: 280ms;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-sheet: cubic-bezier(.32, .72, 0, 1);

    --z-sticky: 2;
    --z-topbar: 20;
    --z-sidebar: 30;
    --z-mheader: 35;
    --z-tabbar: 40;
    --z-scrim: 60;
    --z-sheet: 65;
    --z-dialog: 70;
    --z-popover: 75;
    --z-toast: 80;

    --tabbar-h: calc(64px + env(safe-area-inset-bottom));
    --mheader-h: calc(56px + env(safe-area-inset-top));
    --sidebar-w: 232px;
    --sidebar-w-collapsed: 64px;
    --topbar-h: 52px;

    /* Legacy aliases (old inline styles keep resolving) */
    --positive: var(--gain);
    --negative: var(--loss);
    --fg-dim: var(--fg-subtle);
    --ff-sans: var(--font);
    --ff-display: var(--font);
    --ff-mono: var(--font);
    --radius: var(--r-2);
    --radius-lg: var(--r-card);
    --shadow: none;
  }

  /* ================= TOKENS: dark (system) ================= */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a0b0e;
      --canvas: #0e1013;
      --surface: #14161a;
      --surface-2: #1c1e23;
      --surface-3: #25282d;
      --border: rgb(255 255 255 / .075);
      --border-strong: rgb(255 255 255 / .13);
      --fg: #eff0f3;
      --fg-muted: #aeb3ba;
      --fg-subtle: #91959d;
      --ink: #eff0f3;
      --on-ink: #0a0b0e;
      --scrim: rgb(4 5 7 / .62);
      --accent: #95a7ff;
      --accent-soft: #262d51;
      --on-accent: #0a0b0e;
      --gain: #5ddf9d;
      --loss: #f86e6a;
      --gain-fill: #1f9059;
      --loss-fill: #ff9d88;
      --warn: #f0b648;
      --warn-soft: #3b2b0d;
      --cap-inleg: #44484e;
      --wash-inleg: rgb(255 255 255 / .035);
      --cat-pe: #d95926;
      --cat-idx: #3987e5;
      --cat-pm: #c98500;
      --cat-cr: #d55181;
      --cat-cf: #9085e9;
      --cat-br: #199e70;
      --cat-other: #8e9bb8;
      --cat-liq: #8b9099;
      --shadow-overlay: 0 0 0 1px rgb(255 255 255 / .06), 0 24px 64px rgb(0 0 0 / .55);
      --display-weight: 560;
    }
  }
  /* ================= TOKENS: dark (forced) ================= */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0b0e;
    --canvas: #0e1013;
    --surface: #14161a;
    --surface-2: #1c1e23;
    --surface-3: #25282d;
    --border: rgb(255 255 255 / .075);
    --border-strong: rgb(255 255 255 / .13);
    --fg: #eff0f3;
    --fg-muted: #aeb3ba;
    --fg-subtle: #91959d;
    --ink: #eff0f3;
    --on-ink: #0a0b0e;
    --scrim: rgb(4 5 7 / .62);
    --accent: #95a7ff;
    --accent-soft: #262d51;
    --on-accent: #0a0b0e;
    --gain: #5ddf9d;
    --loss: #f86e6a;
    --gain-fill: #1f9059;
    --loss-fill: #ff9d88;
    --warn: #f0b648;
    --warn-soft: #3b2b0d;
    --cap-inleg: #44484e;
    --wash-inleg: rgb(255 255 255 / .035);
    --cat-pe: #d95926;
    --cat-idx: #3987e5;
    --cat-pm: #c98500;
    --cat-cr: #d55181;
    --cat-cf: #9085e9;
    --cat-br: #199e70;
    --cat-other: #8e9bb8;
    --cat-liq: #8b9099;
    --shadow-overlay: 0 0 0 1px rgb(255 255 255 / .06), 0 24px 64px rgb(0 0 0 / .55);
    --display-weight: 560;
  }

  /* ================= Colour-blind-safe mode ================= */
  :root[data-cvd="on"] {
    --gain: #006bbb;
    --loss: #ac5500;
    --gain-fill: #1d6fb8;
    --loss-fill: #c76a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-cvd="on"]:not([data-theme="light"]) {
      --gain: #67b0f9;
      --loss: #f7ab5d;
      --gain-fill: #3d8fd9;
      --loss-fill: #e8954a;
    }
  }
  :root[data-theme="dark"][data-cvd="on"] {
    --gain: #67b0f9;
    --loss: #f7ab5d;
    --gain-fill: #3d8fd9;
    --loss-fill: #e8954a;
  }

  @media (max-width: 767.98px) {
    :root { --r-card: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --d-1: 0.01ms; --d-2: 0.01ms; --d-3: 0.01ms; }
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ================= Base ================= */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font);
    font-optical-sizing: auto;
    font-size: 14px; line-height: 20px;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    text-size-adjust: 100%;
    -webkit-text-size-adjust: 100%;
  }
  html, body { overflow-x: hidden; max-width: 100vw; }
  @media (max-width: 767.98px) { html, body { font-size: 15px; line-height: 22px; } }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; font-size: inherit; }
  #root { min-height: 100vh; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

  .num, .tnum { font-variant-numeric: tabular-nums lining-nums; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .spin { animation: ui-spin 0.9s linear infinite; }
  @keyframes ui-spin { to { transform: rotate(360deg); } }
  @keyframes ui-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ui-slide-right { from { transform: translateX(calc(100% + 16px)); } to { transform: none; } }
  @keyframes ui-slide-up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes ui-pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes ui-shimmer { 0% { opacity: .55; } 50% { opacity: 1; } 100% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    .sheet--panel, .sheet--bottom { animation-name: ui-fade !important; }
  }

  /* ================= Buttons ================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px;
    border: 1px solid transparent; border-radius: var(--r-2);
    font: 500 13px/1 var(--font);
    cursor: pointer; white-space: nowrap; user-select: none;
    transition: background var(--d-1) var(--ease), opacity var(--d-1) var(--ease), border-color var(--d-1) var(--ease), transform var(--d-1) var(--ease);
    text-decoration: none;
  }
  .btn--sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn--lg { height: 40px; padding: 0 16px; font-size: 14px; }
  .btn--full { width: 100%; }
  .btn--primary { background: var(--ink); color: var(--on-ink); }
  .btn--primary:hover { opacity: .88; }
  .btn--primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 2px var(--canvas); }
  .btn--secondary { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
  .btn--secondary:hover { background: var(--surface-2); }
  .btn--ghost { background: transparent; color: var(--fg); }
  .btn--ghost:hover { background: var(--surface-2); }
  .btn--danger { background: var(--surface); color: var(--loss); border-color: var(--border-strong); }
  .btn--danger:hover { background: var(--surface-2); }
  .btn--danger-fill { background: var(--loss); color: var(--surface); border-color: var(--loss); }
  .btn--danger-fill:hover { opacity: .9; background: var(--loss); }
  .btn:active:not([aria-disabled="true"]) { background-color: var(--surface-3); }
  .btn--primary:active:not([aria-disabled="true"]) { background: var(--ink); opacity: .8; }
  .btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
  .btn .kbd { margin-left: 4px; }

  .icon-btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    border: 0; border-radius: var(--r-2);
    background: transparent; color: var(--fg-muted);
    cursor: pointer; user-select: none; flex-shrink: 0;
    transition: background var(--d-1) var(--ease), color var(--d-1) var(--ease);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .icon-btn--sm { width: 28px; height: 28px; }
  .icon-btn[aria-pressed="true"], .icon-btn.is-active { background: var(--surface-3); color: var(--fg); }
  .icon-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
  .icon-btn__badge { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
  .icon-btn__badge--warn { background: var(--warn); }
  .icon-btn__badge--loss { background: var(--loss); }

  /* ================= Card ================= */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); min-width: 0; }
  .card--clickable { cursor: pointer; transition: border-color var(--d-1) var(--ease); }
  .card--clickable:hover { border-color: var(--border-strong); }
  .card__head { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px 0; }
  .card__titles { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card__title { margin: 0; font: 600 14px/20px var(--font); letter-spacing: -0.006em; color: var(--fg); }
  .card__meta { font-size: 12px; line-height: 16px; color: var(--fg-subtle); }
  .card__actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .card__foot { border-top: 1px solid var(--border); padding: 10px 16px; font-size: 12.5px; color: var(--fg-muted); }

  /* ================= Pill / chip ================= */
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font: 550 11px/1 var(--font); white-space: nowrap; border: 1px solid transparent; }
  .pill--neutral { background: var(--surface-2); color: var(--fg-muted); }
  .pill--outline { background: transparent; color: var(--fg-muted); border-color: var(--border-strong); }
  .pill--warn { background: var(--warn-soft); color: var(--warn); }
  .pill--gain { background: var(--gain-soft); color: var(--gain); }
  .pill--loss { background: var(--loss-soft); color: var(--loss); }
  .pill--accent { background: var(--accent-soft); color: var(--accent); }

  .chip {
    position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 10px;
    border: 1px dashed var(--border-strong); border-radius: var(--r-2);
    background: transparent; color: var(--fg-muted);
    font: 500 12px/1 var(--font); cursor: pointer; user-select: none; white-space: nowrap;
    transition: background var(--d-2) var(--ease), border-color var(--d-2) var(--ease), color var(--d-2) var(--ease);
  }
  .chip:hover { color: var(--fg); background: var(--surface-2); }
  .chip[aria-pressed="true"] { border-style: solid; border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: var(--accent-soft); color: var(--fg); }
  .chip[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
  .chip__count { color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
  .chip__remove { display: inline-flex; margin-right: -4px; padding: 2px; border: 0; background: none; color: inherit; cursor: pointer; border-radius: 4px; }

  /* ================= Segmented / tabs ================= */
  .seg { display: inline-flex; align-items: stretch; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: var(--r-2); }
  .seg--full { display: flex; width: 100%; }
  .seg--full .seg__btn { flex: 1; }
  .seg__btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    min-width: 0; height: 26px; padding: 0 10px;
    border: 0; border-radius: 6px; background: transparent; color: var(--fg-muted);
    font: 550 12px/1 var(--font); cursor: pointer; user-select: none; white-space: nowrap;
    transition: background var(--d-2) var(--ease), color var(--d-2) var(--ease), box-shadow var(--d-2) var(--ease);
  }
  .seg__btn::after { content: ''; position: absolute; inset: -5px 0; }
  .seg__btn:hover { color: var(--fg); }
  .seg__btn[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--border-strong); }
  :root[data-theme="dark"] .seg__btn[aria-checked="true"] { background: var(--surface-3); box-shadow: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg__btn[aria-checked="true"] { background: var(--surface-3); box-shadow: none; } }
  .seg__btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
  .seg--sm .seg__btn { height: 22px; padding: 0 8px; font-size: 11.5px; }
  .seg--lg .seg__btn { height: 32px; padding: 0 14px; font-size: 13px; }
  .seg--pill { border-radius: var(--r-pill); padding: 4px; }
  .seg--pill .seg__btn { border-radius: var(--r-pill); height: 32px; }

  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tab { position: relative; height: 40px; padding: 0 2px; border: 0; background: none; color: var(--fg-muted); font: 550 14px/1 var(--font); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); }
  .tab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }

  /* ================= Fields ================= */
  .field { display: block; min-width: 0; }
  .field__label { display: block; margin-bottom: 6px; font: 500 12px/16px var(--font); color: var(--fg-muted); }
  .field__hint { margin-top: 4px; font-size: 11.5px; line-height: 16px; color: var(--fg-subtle); }
  .field__error { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11.5px; line-height: 16px; color: var(--loss); }
  .input {
    display: block; width: 100%; height: 32px; padding: 0 10px;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: var(--r-2);
    font: 400 13.5px/1.2 var(--font); outline: none;
    transition: border-color var(--d-1) var(--ease), box-shadow var(--d-1) var(--ease);
  }
  .input::placeholder { color: var(--fg-subtle); }
  .input:focus, .input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); outline: none; }
  .input[aria-invalid="true"] { border-color: var(--loss); }
  .input:disabled { opacity: .5; }
  .input--select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--fg-subtle) 50%), linear-gradient(135deg, var(--fg-subtle) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .input--textarea { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
  .money-input { position: relative; display: flex; align-items: center; }
  .money-input__affix { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; color: var(--fg-subtle); pointer-events: none; font-variant-numeric: tabular-nums; }
  .money-input__affix--pre { left: 10px; }
  .money-input__affix--suf { right: 10px; }
  .money-input .input { font-variant-numeric: tabular-nums lining-nums; }
  .money-input--pre .input { padding-left: 26px; }
  .money-input--suf .input { padding-right: 34px; }
  .money-input--large .input { height: 48px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .money-input--large.money-input--pre .input { padding-left: 34px; }
  .money-input--large .money-input__affix--pre { font-size: 20px; }
